# Experiment matrix: model x input mode x prompt version x sampling.
# `python main.py` runs every experiment that has no results yet (results/runs/<name>/),
# then scores all of them against the golden set into results/comparison.md.
#
# Sampling: current Claude models reject non-default temperature/top_p, so their knob is
# `effort` (thinking depth); temperature/top_p apply to Ollama and OpenRouter models.

[defaults]
manifest = "data/manifests/golden.csv"
prompt = "v3"
timeout_s = 120      # per request; local models get at least 600
max_retries = 2      # transport retries (HTTP 429/5xx, timeouts); validation retry is separate

# --- Provider model: Claude Haiku 5.5 (Anthropic API) --------------------------------
[[experiments]]
name = "haiku_text_v3_medium"
model = "haiku"
mode = "text"
sampling = { effort = "medium" }

[[experiments]]
name = "haiku_image_v3_medium"
model = "haiku"
mode = "image"
sampling = { effort = "medium" }

[[experiments]]
name = "haiku_text-image_v3_medium"
model = "haiku"
mode = "text+image"
sampling = { effort = "medium" }

[[experiments]]
name = "haiku_pdf_v3_medium"
model = "haiku"
mode = "pdf"
sampling = { effort = "medium" }

# All documents of the core tier (50 texts), production candidate configuration.
[[experiments]]
name = "haiku_image_v3_medium_tier50"
model = "haiku"
mode = "image"
manifest = "data/manifests/dataset_050.csv"
sampling = { effort = "medium" }

