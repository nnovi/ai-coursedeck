[project]
name = "coursedeck"
version = "0.1.0"
description = "Teacher assistant: lecture-notes PDF -> structured lecture card -> Visme presentation draft"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "pymupdf>=1.26",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coursedeck"]

[tool.ruff]
line-length = 100
